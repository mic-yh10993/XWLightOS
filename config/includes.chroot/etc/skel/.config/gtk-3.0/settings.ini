# XWLightOS GTK3 fallback settings (new users inherit via /etc/skel).
# The GNOME session itself reads dconf, but non-GNOME sessions and
# apps that read settings.ini directly must also land on WhiteSur-Light
# with dark theme explicitly off -- user report 2026-10-24: legacy apps
# WhiteSur-Light, no black-on-black text anywhere.
[Settings]
gtk-theme-name=WhiteSur-Light
gtk-icon-theme-name=WhiteSur-light
gtk-cursor-theme-name=WhiteSur-cursors
gtk-font-name=Noto Sans CJK SC 11
gtk-application-prefer-dark-theme=false
