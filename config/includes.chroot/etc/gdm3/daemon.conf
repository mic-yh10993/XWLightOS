# XWLightOS GDM daemon configuration.
#
# 重要：Debian 的 gdm3 打包时用 -Dcustom-conf=/etc/gdm3/daemon.conf 编译，
# GDM 只读这个文件（外加 /run/gdm3/custom.conf），从不读 /etc/gdm3/custom.conf。
# 2026-10-17 根因实证：自动登录配置曾误放在 custom.conf，GDM 根本看不到，
# 导致 10-11 切 GNOME 后 live 自动登录在运行时从未生效（QEMU 门禁连续失败）。
# 此文件是 GDM 唯一会读的 daemon 配置，不要再创建 custom.conf。
#
# Live ISO: autologin as the disposable `user` baked into the image at build
# time (see the 1700 hook) and repaired at boot by
# xwlightos-live-session-init.service. The Calamares postinstall removes the
# AutomaticLogin lines on installed systems so GDM shows the login screen.
# X11 session is forced for VM/guest compatibility (no vmtools needed).
[daemon]
AutomaticLoginEnable=True
AutomaticLogin=user
WaylandEnable=False

[security]

[xdmcp]

[chooser]

[debug]
# 打开 GDM 调试日志：autologin 是否被尝试、seat 判定、PAM 会话都会进 journal。
# 配合内核 cmdline 的 systemd.journald.forward_to_console，CI 烟测可从串口
# 直接看到 GDM 的决策过程，便于定位登录问题。仅增加日志量，不改变行为。
Enable=True
