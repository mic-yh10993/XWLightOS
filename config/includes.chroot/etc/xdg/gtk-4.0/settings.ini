# XWLightOS system-wide GTK4 fallback (XDG_CONFIG_DIRS default is /etc/xdg).
# libadwaita apps follow dconf color-scheme, but plain GTK4 apps outside a
# GNOME session read settings.ini; pin them to WhiteSur-Light with dark
# explicitly off, same values as the GTK3 system fallback.
# User report 2026-10-25: all programs still show black text on a black
# background -- every GTK channel must pin light explicitly, not just dconf.
[Settings]
gtk-theme-name=WhiteSur-Light
gtk-icon-theme-name=WhiteSur-light
gtk-cursor-theme-name=WhiteSur-cursors
gtk-font-name=Noto Sans CJK SC 11
gtk-application-prefer-dark-theme=false
