; XWLightOS 系统级 ONLYOFFICE Desktop Editors 配置（QSettings 系统域）。
; 该文件由 Qt 的 QSettings(SystemScope, "onlyoffice", "DesktopEditors")
; 读取，路径即 /etc/xdg/onlyoffice/DesktopEditors.conf，对全部用户生效；
; 依据为上游 desktop-apps 源码 win-linux/src/cascapplicationmanagerwrapper.cpp
; 与 defines.h（GET_REGISTRY_SYSTEM 宏），并与 9.4.0 官方包二进制中的
; 同名键比对一致。
; pluginsDisabled：应用的插件总开关。该键缺省时代码取默认 true 并赋给
; plugins_support（出厂插件可用，与实测一致），故置 false 即在加载层
; 关闭整个插件支持——自带插件（Photo Editor/OCR/Typograf/Doc2md/
; LanguageTool/AI/AI agent/Plugin Manager/Send/Thesaurus/Zotero/
; Encryption/DeepL）全部不加载、界面不显示，AI 功能区随之消失。
; 这是官方配置路线，不删应用文件；改回 true 或删本文件即恢复。
[General]
pluginsDisabled = false
