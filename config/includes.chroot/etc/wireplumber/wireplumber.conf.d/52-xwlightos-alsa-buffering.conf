# XWLightOS: ALSA 播放缓冲加大——治虚拟机里看视频声音断断续续。
#
# 定案（用户 2026-10-31 实测，Build 57 VMware 虚拟机）：看视频时
# 音频持续断续、“根本用不了”；而 speaker-test 用巨大 ALSA 缓冲播
# 放干净。同链路在缓冲宽裕时没问题、在 PipeWire 常规小 quantum
# 实时投递时欠载——这是 VMware/VirtualBox 模拟 HDA 的经典爆音
# 形态，与音量缺陷（见 51 号 drop-in）是两个独立子缺陷。
#
# 杠杆：上游随包 alsa-vm.conf 给虚拟机声卡的是 period-size=1024、
# headroom=2048；这里把 VM 默认提到 period 2048（约 42ms）、
# headroom 16384，并给全部 ALSA 输出节点追加同一组规则——真机
# （希沃 HDA）也适用：period 加大只增加约几十毫秒延迟、换欠载
# 余量，对课堂播放无副作用。配套：图级 quantum 下限已在 pipewire
# 的 drop-in（51-xwlightos-quantum.conf）同步钉到 2048、rtkit 已进
# 包清单（数据线程实时优先级）；2026-11-02 第七轮（用户令“调高
# 缓存”，推翻 10-31 不加档决定）：真机本地视频嘟嘟卡顿、选错设备
# 已排除，故 period 1024→2048、headroom 8192→16384；若本档仍断，
# 下一杠杆是查链路本身（USB 音频 gadget 路径），不是继续加档。
#
# 第 14 轮（Trixie）：WirePlumber 0.5 删掉了 Lua 配置（main.lua.d
# 机制已不存在），改用 .conf 片段。本文件取代旧的
# 52-xwlightos-alsa-buffering.lua；matches/update-props 写法照随包
# alsa-vm.conf（0.5.8）的原文。注意：monitor.alsa.rules 是数组，
# 本文件定义的是完整数组（VM 规则 + 全输出规则），即使覆盖上游
# alsa-vm.conf 的数组也不丢规则（VM 规则本就是它的加档版）。
monitor.alsa.rules = [
  # 虚拟机声卡（照 alsa-vm.conf 的匹配条件，数值加档）
  {
    matches = [
      {
        node.name = "~alsa_input.pci.*"
        cpu.vm.name = "~.*"
      }
      {
        node.name = "~alsa_output.pci.*"
        cpu.vm.name = "~.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.period-size   = 2048
        api.alsa.headroom      = 16384
      }
    }
  }
  # 全部 ALSA 输出节点（真机希沃 HDA 同样适用）
  {
    matches = [
      {
        node.name = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.period-size   = 2048
        api.alsa.headroom      = 16384
      }
    }
  }
]
