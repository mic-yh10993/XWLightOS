# XWLightOS bootloader identity and presentation.
GRUB_DISTRIBUTOR="XWLightOS"
GRUB_THEME="/boot/grub/themes/xwlightos/theme.txt"
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=6
GRUB_DEFAULT=0
GRUB_DISABLE_OS_PROBER=false
# Plymouth needs quiet+splash or the boot is a scrolling text log
# and the splash animation never appears (user report 2026-10-24).
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
