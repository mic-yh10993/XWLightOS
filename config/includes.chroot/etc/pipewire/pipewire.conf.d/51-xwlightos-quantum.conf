# XWLightOS: 图 quantum 下限钉到 2048——治弱 CPU/虚拟机上实时音频
# 被饿死导致的断续（用户 2026-10-31 实测：VM 里看视频声音持续断，
# speaker-test 巨大缓冲却干净；音量状态 A/B 已证伪与音量无关）。
#
# 依据（Debian 随包 /usr/share/pipewire/pipewire.conf 原文）：出厂
# default.clock.min-quantum = 16，即单个流可以把整张图拉到 16 采样
# （48kHz 下约 0.33ms）一轮——弱虚拟 CPU 上数据线程喂不及就欠载
# 爆音。把下限钉到 1024（=上游默认 quantum，约 21ms）后，任何流都
# 不能再把图拉进危险区；配合 WirePlumber 侧的 ALSA period 加大
# （52-xwlightos-alsa-buffering.conf）与 rtkit 实时优先级（包清单）
# 三件套，目标都是同一件事：负载下先保实时投递不中断。
# 2026-11-02 第七轮（用户令“调高缓存”）：真机实测本地视频完全
# 听不见声音、只有嘟嘟卡顿声，且其它输出全静、选中输出才出声——
# 选错设备已排除，剩下缓冲/链路。用户明确推翻 2026-10-31“不再
# 加档”的决定，下限再提到 2048（约 42ms），代价是延迟再增约
# 21ms，对课堂播放无实质影响；若本档仍断，下一杠杆是查链路
# 本身（USB 音频 gadget 路径），不是继续无脑加档。
context.properties = {
    default.clock.min-quantum = 2048
}
