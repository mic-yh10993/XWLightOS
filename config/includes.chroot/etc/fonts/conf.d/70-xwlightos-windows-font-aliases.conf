<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- XWLightOS: Windows 常用中文字体别名（用户 2026-10-18 邮件指令）。
     事实：ONLYOFFICE 官方 deb 安装时不会下载任何字体（Build 55 的 build.log
     为证），微软雅黑等是微软专有字体、无法通过公开渠道合法下载。
     此处把这些字体名别名到镜像已安装的 Noto CJK，保证 ONLYOFFICE 打开
     Windows 文档时中文正常显示，而不是回退到缺字形/乱码。 -->
<fontconfig>
  <alias>
    <family>微软雅黑</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias>
    <family>Microsoft YaHei</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias>
    <family>Microsoft YaHei UI</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias>
    <family>宋体</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias>
    <family>SimSun</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias>
    <family>新宋体</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias>
    <family>NSimSun</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias>
    <family>黑体</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias>
    <family>SimHei</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias>
    <family>楷体</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias>
    <family>KaiTi</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias>
    <family>华文楷体</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias>
    <family>STKaiti</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias>
    <family>仿宋</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias>
    <family>FangSong</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias>
    <family>华文仿宋</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
