# XWLightOS: Build 72 声音修法（第十一轮）。
# 诊断实锤（2026-11-10 用户取证）：snd_hda_intel power_save=1，
# 声卡空闲 1 秒就断电，是 HDMI 音频断续的常见根源。关掉它与控制器，
# 让 HDA 链路保持供电。用户之前那次同款修复在 LiveCD 上根本没生效
# （模块开机已加载、配置文件重启即丢），不是办法无效；写进镜像才
# 能从开机起生效。DeepSeek 的启动参数（intel_iommu=igfx_off、
# snd_hda_intel.snoop=0、align_buffer_size=1）不采用：已查是 Haswell
# 老机器在 6.8 内核上的个案，与本机芯片对不上号，未验证。
options snd_hda_intel power_save=0 power_save_controller=N
