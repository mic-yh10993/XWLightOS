# XWLightOS 触屏对齐（第九轮，2026-11-06）：希沃 T86EA 的触屏
# gadget（CVTE 1FF7:0F26）只对 Windows 的问答时序调过，Linux
# 在枚举期多问的报告请求可能把它问住。这里给 usbhid 加设备
# 级 quirks，让它对这台设备少提问：
#   HID_QUIRK_NOGET            = BIT(3)  = 0x00000008
#   HID_QUIRK_NO_INIT_REPORTS  = BIT(29) = 0x20000000
#   合并掩码                              = 0x20000008
# 位值出处：出货内核 6.1 同世代源码 include/linux/hid.h 的怪癖
# 定义段（NOGET=BIT(3)、NO_INIT_REPORTS=BIT(29)），非凭记忆。
# 语义：usbhid_start 不再调 usbhid_init_reports 在枚举期批量
# GET_REPORT 取 input/feature 初始值；内核据 NOGET 跳过对其
# 余路径对该设备的 GET_REPORT。
# 是否真生效以运行时回读为准：诊断脚本读
# /sys/module/usbhid/parameters/quirks 并在结论区呈现。
options usbhid quirks=0x1ff7:0x0f26:0x20000008
