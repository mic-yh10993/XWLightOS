# XWLightOS: initramfs 必须与具体硬件无关（用户 2026-10-31 定调：
# 开机动画参考 Kali 的多设备兼容做法）。MODULES=most 把当前内核的
# 绝大多数驱动打进 initramfs，而不是按构建机硬件裁剪（dep）——live
# 镜像的 initramfs 在构建环境生成，用 dep 只会带上构建机的驱动，
# 换一台机器（希沃 Intel 核显 / VMware SVGA / VirtIO GPU）开机时
# Plymouth 就拿不到 DRM 设备、回落文字模式。此处用 conf.d 覆盖层
# 显式钉死，不依赖 initramfs-tools 包的默认值恰好是 most。
MODULES=most
