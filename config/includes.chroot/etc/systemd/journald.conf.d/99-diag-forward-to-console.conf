# DIAGNOSTIC ONLY (2026-10-25, [diag] build): temporarily forward the journal
# to the serial console so the QEMU smoke test can see GDM/session logs when
# the desktop fails to render. REVERT BEFORE ANY RELEASE BUILD: forwarding
# re-enables boot-time console text that masks the Plymouth splash on real
# hardware (removed 2026-10-24 for exactly that reason). This file must not
# ship in a build the user tests.
[Journal]
ForwardToConsole=yes
MaxLevelConsole=debug
