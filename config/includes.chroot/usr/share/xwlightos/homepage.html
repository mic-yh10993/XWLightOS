<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XWLightOS主页</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235DE3FF'/%3E%3Cstop offset='1' stop-color='%23766BFF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect
 width='100' height='100' rx='24' fill='%23070c18'/%3E%3Cpath d='M22 28 L38 50 L22 72' stroke='url(%23g)' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M42 50 L54 32 L66 68 L78 32 L90 50' stroke='url(%23g)' stroke-width='7'
 fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<style>

/* ============ 基础 ============ /

{margin:0;padding:0;box-sizing:border-box;}

:root{

--c1:#5DE3FF;

--c2:#4895FF;

--c3:#766BFF;

--text:#EAF1FF;

--muted:#8494AB;

--glass:rgba(255,255,255,.045);

--stroke:rgba(255,255,255,.10);

--lx:0px;

--ly:0px;

}

html,body{height:100%;}

body{

font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;

background:#05070f;

color:var(--text);

overflow-x:hidden;

-webkit-font-smoothing:antialiased;

text-rendering:optimizeLegibility;

}

::selection{background:rgba(93,227,255,.28);color:#fff;}

/* ============ 背景层 ============ /

#bg{

position:fixed;inset:0;z-index:0;display:block;

}

.aurora{

position:fixed;inset:0;z-index:0;pointer-events:none;

background:

radial-gradient(640px 640px at 16% 18%, rgba(93,227,255,.17), transparent 70%),

radial-gradient(720px 720px at 84% 26%, rgba(118,107,255,.17), transparent 70%),

radial-gradient(680px 680px at 50% 96%, rgba(72,149,255,.13), transparent 70%);

animation:auroraShift 20s ease-in-out infinite alternate;

will-change:transform,opacity;

}

@keyframes auroraShift{

0% {transform:translate3d(0,0,0) scale(1); opacity:.85;}

50% {transform:translate3d(-2.5%,1.5%,0) scale(1.10); opacity:1;}

100%{transform:translate3d(2.5%,-1.5%,0) scale(1.03); opacity:.8;}

}

.vignette{

position:fixed;inset:0;z-index:1;pointer-events:none;

background:radial-gradient(ellipse at 50% 45%, transparent 42%, rgba(0,0,0,.62) 100%);

}

.cursor-glow{

position:fixed;top:0;left:0;z-index:1;pointer-events:none;

width:560px;height:560px;margin-left:-280px;margin-top:-280px;

border-radius:50%;

background:radial-gradient(circle, rgba(93,227,255,.11) 0%, rgba(118,107,255,.07) 38%, transparent 68%);

mix-blend-mode:screen;

transform:translate3d(-999px,-999px,0);

will-change:transform;

transition:opacity .6s;

}

/* ============ 主舞台 ============ /

.stage{

position:relative;z-index:2;

min-height:100dvh;

display:flex;flex-direction:column;

align-items:center;justify-content:center;

gap:clamp(20px,3.2vh,42px);

padding:56px 24px 48px;

}

/* ---- Logo ---- /

.logo-parallax{

transform:translate3d(var(--lx),var(--ly),0);

transition:transform .45s cubic-bezier(.22,1,.36,1);

will-change:transform;

animation:fadeUp .9s cubic-bezier(.22,1,.36,1) both;

}

.logo{

display:block;

width:min(420px,78vw);

height:auto;

overflow:visible;

filter:drop-shadow(0 0 22px rgba(72,149,255,.32));

animation:floatY 7s ease-in-out infinite;

}

@keyframes floatY{

0%,100%{transform:translateY(0);}

50% {transform:translateY(-9px);}

}

.logo-text{opacity:0;animation:fadeIn 1.1s ease .85s forwards;}

@keyframes fadeIn{to{opacity:1;}}

/* ---- 时钟 ---- /

.clock{

text-align:center;

animation:fadeUp .9s cubic-bezier(.22,1,.36,1) .16s both;

}

.time{

display:flex;align-items:baseline;justify-content:center;gap:.1em;

line-height:1;

}

.hm{

font-size:clamp(42px,7vw,68px);

font-weight:200;

letter-spacing:.03em;

font-variant-numeric:tabular-nums;

background:linear-gradient(115deg,#FFFFFF 0%,#B7DDFF 48%,#9A8CFF 100%);

-webkit-background-clip:text;background-clip:text;

color:transparent;

filter:drop-shadow(0 2px 26px rgba(93,227,255,.28));

}

.colon{

animation:blink 2s steps(1,end) infinite;

}

@keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:.25;}}

.sec{

font-size:clamp(15px,2vw,21px);

font-weight:300;

color:var(--c1);

opacity:.72;

font-variant-numeric:tabular-nums;

letter-spacing:.08em;

transform:translateY(-.35em);

display:inline-block;

}

.date{

margin-top:14px;

font-size:13.5px;

letter-spacing:.14em;

color:var(--muted);

display:flex;align-items:center;justify-content:center;gap:12px;

flex-wrap:wrap;

}

.date .dot{opacity:.4;}

/* ---- 搜索框 ---- /

.search{

position:relative;

width:min(680px,92vw);

height:66px;

display:flex;align-items:center;gap:14px;

padding:0 9px 0 24px;

border-radius:999px;

background:rgba(255,255,255,.045);

border:1px solid var(--stroke);

backdrop-filter:blur(22px) saturate(150%);

-webkit-backdrop-filter:blur(22px) saturate(150%);

box-shadow:0 10px 44px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.06);

transition:background .35s, border-color .35s, box-shadow .45s, transform .35s;

animation:fadeUp .9s cubic-bezier(.22,1,.36,1) .3s both;

}

.search::after{

content:'';

position:absolute;left:50%;bottom:-3px;

width:0;height:2px;border-radius:2px;

background:linear-gradient(90deg,transparent,var(--c1),var(--c3),transparent);

transform:translateX(-50%);

opacity:0;

transition:width .55s cubic-bezier(.22,1,.36,1), opacity .4s;

}

.search:focus-within{

background:rgba(255,255,255,.075);

border-color:rgba(93,227,255,.5);

transform:translateY(-2px);

box-shadow:

0 0 0 3px rgba(93,227,255,.11),

0 0 54px rgba(72,149,255,.30),

0 12px 44px rgba(0,0,0,.45),

inset 0 1px 0 rgba(255,255,255,.09);

}

.search:focus-within::after{width:72%;opacity:1;}

.s-icon{

width:21px;height:21px;flex:none;

stroke:var(--muted);fill:none;stroke-width:2;

stroke-linecap:round;stroke-linejoin:round;

transition:stroke .35s, transform .35s;

}

.search:focus-within .s-icon{stroke:var(--c1);transform:scale(1.08);}

.search input{

flex:1;height:100%;min-width:0;

background:none;border:0;outline:0;

color:var(--text);

font-size:17px;font-family:inherit;letter-spacing:.01em;

}

.search input::placeholder{color:#6b7b93;transition:color .3s;}

.search:focus-within input::placeholder{color:#8494AB;}

.search button{

flex:none;width:48px;height:48px;border:0;border-radius:50%;

display:grid;place-items:center;cursor:pointer;

background:linear-gradient(135deg,var(--c1),var(--c2) 52%,var(--c3));

color:#04101f;

box-shadow:0 4px 20px rgba(72,149,255,.42);

transition:transform .3s cubic-bezier(.22,1,.36,1), box-shadow .35s, filter .3s;

}

.search button svg{stroke:#04101f;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}

.search button:hover{

transform:scale(1.07) rotate(9deg);

box-shadow:0 6px 30px rgba(93,227,255,.6);

filter:brightness(1.08);

}

.search button:active{transform:scale(.94);}

@keyframes shake{

10%,90%{transform:translateX(-3px);}

20%,80%{transform:translateX(5px);}

30%,50%,70%{transform:translateX(-8px);}

40%,60%{transform:translateX(8px);}

}

.search.shake{animation:shake .48s cubic-bezier(.36,.07,.19,.97);}

/* ---- 快捷链接 ---- /

.links{

display:flex;flex-wrap:wrap;gap:16px;justify-content:center;

max-width:min(680px,92vw);

}

.link{

width:78px;

display:flex;flex-direction:column;align-items:center;gap:9px;

text-decoration:none;color:var(--muted);

-webkit-tap-highlight-color:transparent;

animation:fadeUp .8s cubic-bezier(.22,1,.36,1) both;

animation-delay:var(--d,.5s);

}

.tile{

position:relative;overflow:hidden;

width:56px;height:56px;border-radius:18px;

display:grid;place-items:center;

font-size:19px;font-weight:600;color:#fff;letter-spacing:.02em;

background:linear-gradient(145deg,var(--g1),var(--g2));

box-shadow:0 6px 20px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.28);

transition:transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s;

}

.tile::after{

content:'';

position:absolute;top:-60%;left:-120%;

width:60%;height:220%;

background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);

transform:rotate(18deg);

transition:left .6s cubic-bezier(.22,1,.36,1);

}

.link:hover .tile{

transform:translateY(-7px) scale(1.06);

box-shadow:0 14px 34px rgba(0,0,0,.55), 0 0 26px var(--glow,rgba(93,227,255,.5)), inset 0 1px 0 rgba(255,255,255,.32);

}

.link:hover .tile::after{left:130%;}

.link:hover .label{color:var(--text);}

.label{

font-size:12px;letter-spacing:.06em;

transition:color .3s;

white-space:nowrap;

}

/* ---- 入场动画 ---- /

@keyframes fadeUp{

from{opacity:0;transform:translateY(22px);}

to {opacity:1;transform:translateY(0);}

}

/* ---- 响应式 ---- /

@media (max-height:780px){

.stage{gap:22px;padding:34px 20px 28px;}

.logo{width:min(340px,70vw);}

.search{height:60px;}

.search button{width:44px;height:44px;}

.date{margin-top:10px;}

}

@media (max-width:520px){

.stage{gap:24px;padding:44px 18px 34px;}

.logo{width:82vw;}

.search{padding-left:18px;height:58px;}

.search input{font-size:15.5px;}

.link{width:66px;}

.tile{width:50px;height:50px;border-radius:16px;font-size:17px;}

.date{font-size:12px;letter-spacing:.08em;}

}

@media (prefers-reduced-motion:reduce){

,::before,::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important;}

}

</style>

</head>

<body>

<canvas id="bg" aria-hidden="true"></canvas>

<div class="aurora" aria-hidden="true"></div>

<!-- ===== 快捷链接 ===== -->

<nav class="links" aria-label="快捷链接">

<a class="link" href="https://www.bing.com" style="--d:.46s">

<span class="tile" style="--g1:#22B8F0;--g2:#0072C6;--glow:rgba(0,164,239,.55)">B</span>

<span class="label">Bing搜索</span>

</a>

</a>

<span class="label">哔哩哔哩</span>

</a>

<span class="tile" style="--g1:#3AA3FF;--g2:#0066CC;--glow:rgba(0,132,255,.55)">易</span>

</main>

<script>

(function () {

'use strict';

/* ============================================================

function resizeCanvas() {

DPR = Math.min(window.devicePixelRatio || 1, 2);

W = window.innerWidth;

H = window.innerHeight;

canvas.width = Math.floor(W * DPR);

canvas.height = Math.floor(H * DPR);

canvas.style.width = W + 'px';

canvas.style.height = H + 'px';

ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

buildParticles();

}

function buildParticles() {

particles.length = 0;

const count = Math.min(110, Math.max(38, Math.round((W * H) / 16000)));

for (let i = 0; i < count; i++) {

const vx = (Math.random() - 0.5) * 0.32;

const vy = (Math.random() - 0.5) * 0.32;

particles.push({

x: Math.random() * W,

y: Math.random() * H,

vx, vy,

bvx: vx, bvy: vy,

r: Math.random() * 1.7 + 0.7,

cyan: Math.random() < 0.62,

a: Math.random() * 0.45 + 0.28,

ph: Math.random() * Math.PI * 2

});

}

}

function drawParticles(t) {

ctx.clearRect(0, 0, W, H);

const n = particles.length;

// 更新 + 绘制点

for (let i = 0; i < n; i++) {

const p = particles[i];

// 鼠标排斥

const mdx = p.x - mouse.x;

const mdy = p.y - mouse.y;

const md2 = mdx * mdx + mdy * mdy;

if (md2 < 22000 && md2 > 0.5) {

const md = Math.sqrt(md2);

const f = (1 - md / 148) * 0.055;

p.vx += (mdx / md) * f;

p.vy += (mdy / md) * f;

}

// 回归基础速度

p.vx += (p.bvx - p.vx) * 0.022;

p.vy += (p.bvy - p.vy) * 0.022;

p.x += p.vx;

p.y += p.vy;

// 环绕边界

if (p.x < -24) p.x = W + 24;

else if (p.x > W + 24) p.x = -24;

if (p.y < -24) p.y = H + 24;

else if (p.y > H + 24) p.y = -24;

const twinkle = 0.72 + 0.28 * Math.sin(t * 0.0013 + p.ph);

const alpha = p.a * twinkle;

ctx.beginPath();

ctx.arc(p.x, p.y, p.r, 0, 6.28318);

ctx.fillStyle = p.cyan

? 'rgba(93,227,255,' + alpha.toFixed(3) + ')'

: 'rgba(140,128,255,' + alpha.toFixed(3) + ')';

ctx.fill();

}

// 连线

ctx.lineWidth = 0.7;

for (let i = 0; i < n; i++) {

const p = particles[i];

for (let j = i + 1; j < n; j++) {

const q = particles[j];

const dx = p.x - q.x;

const dy = p.y - q.y;

const d2 = dx * dx + dy * dy;

if (d2 < MAX_LINK_SQ) {

const alpha = (1 - Math.sqrt(d2) / MAX_LINK) * 0.17;

if (alpha <= 0.004) continue;

ctx.strokeStyle = 'rgba(96,190,255,' + alpha.toFixed(3) + ')';

ctx.beginPath();

ctx.moveTo(p.x, p.y);

ctx.lineTo(q.x, q.y);

ctx.stroke();

}

}

}

}

function loopBg(t) {

drawParticles(t);

rafBg = requestAnimationFrame(loopBg);

}

resizeCanvas();

rafBg = requestAnimationFrame(loopBg);

let resizeTimer = null;

window.addEventListener('resize', function () {

clearTimeout(resizeTimer);

resizeTimer = setTimeout(resizeCanvas, 140);

});

/* ============================================================

/* ============================================================

function greeting(h) {

if (h < 5) return '夜深了';

if (h < 8) return '清晨好';

if (h < 11) return '早上好';

if (h < 13) return '中午好';

if (h < 17) return '下午好';

if (h < 19) return '傍晚好';

if (h < 23) return '晚上好';

return '夜深了';

}

function pad(n) { return n < 10 ? '0' + n : '' + n; }

function updateClock() {

const d = new Date();

hhEl.textContent = pad(d.getHours());

mmEl.textContent = pad(d.getMinutes());

ssEl.textContent = pad(d.getSeconds());

dateEl.textContent = d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日 星期' + WEEK[d.getDay()];

greetEl.textContent = greeting(d.getHours());

}

updateClock();

setInterval(updateClock, 1000);

/* ============================================================

function shakeForm() {

form.classList.remove('shake');

void form.offsetWidth;

form.classList.add('shake');

setTimeout(function () { form.classList.remove('shake'); }, 500);

}

form.addEventListener('submit', function (e) {

e.preventDefault();

const raw = input.value.trim();

if (!raw) { shakeForm(); input.focus(); return; }

const isUrl =

/^https?:///i.test(raw) ||

(/^[\w-]+(.[\w-]+)+([/?#][^\s])?$/.test(raw) && !/\s/.test(raw));

if (isUrl) {

window.location.href = /^https?:///i.test(raw) ? raw : 'https://' + raw;

return;

}

window.location.href = 'https://www.bing.com/search?q=' + encodeURIComponent(raw);

});

/* ---- 打字机占位符 ---- /

const hints = [

'在 Bing 上搜索…',

'输入网址直接访问…',

'按 / 快速聚焦搜索框',

'搜索你感兴趣的内容…'

];

let hi = 0, ci = 0, dir = 1, wait = 0;

setInterval(function () {

if (document.activeElement === input || input.value.trim()) return;

if (wait > 0) { wait--; return; }

const full = hints[hi];

if (dir === 1) {

ci++;

input.placeholder = full.slice(0, ci);

if (ci >= full.length) { dir = -1; wait = 58; }

} else {

ci--;

input.placeholder = full.slice(0, ci);

if (ci <= 0) { dir = 1; hi = (hi + 1) % hints.length; wait = 10; }

}

}, 48);

/* ---- 快捷键 ---- /

window.addEventListener('keydown', function (e) {

const tag = (document.activeElement && document.activeElement.tagName) || '';

const typing = tag === 'INPUT' || tag === 'TEXTAREA';

if (e.key === '/' && !typing) {

e.preventDefault();

input.focus();

input.select();

}

if (e.key === 'Escape' && document.activeElement === input) {

input.value = '';

input.blur();

}

});

/* ============================================================

let targetX = -9999, targetY = -9999;

let curX = -9999, curY = -9999;

let glowActive = false;

if (isFinePointer) {

window.addEventListener('mousemove', function (e) {

targetX = e.clientX;

targetY = e.clientY;

mouse.x = e.clientX;

mouse.y = e.clientY;

const nx = (e.clientX / window.innerWidth - 0.5);

const ny = (e.clientY / window.innerHeight - 0.5);

root.style.setProperty('--lx', (nx * 16).toFixed(2) + 'px');

root.style.setProperty('--ly', (ny * 11).toFixed(2) + 'px');

if (!glowActive) { glowActive = true; glow.style.opacity = '1'; }

}, { passive: true });

window.addEventListener('mouseleave', function () {

glowActive = false;

glow.style.opacity = '0';

mouse.x = -9999;

mouse.y = -9999;

root.style.setProperty('--lx', '0px');

root.style.setProperty('--ly', '0px');

});

(function loopGlow() {

curX += (targetX - curX) * 0.11;

curY += (targetY - curY) * 0.11;

glow.style.transform = 'translate3d(' + curX.toFixed(1) + 'px,' + curY.toFixed(1) + 'px,0)';
