---
name: Build XWLightOS Live ISO

on:
  push:
    branches: [main, xwlightos-1.0-integration]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xwlightos-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build XWLightOS LiveCD and installer image
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The #53/#54 failure class, guarded mechanically: a comment line
      # placed between \-continuations of a multi-line shell command.
      # Bash strips the backslash-newline before it parses comments, so
      # the comment terminates the command early and the next flag runs
      # as its own command -> "command not found" (exit 127). bash -n
      # does NOT catch this (the split is still valid syntax), so this
      # step fails the workflow fast with the offending line number.
      - name: Lint workflow for comments inside shell continuations
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re, sys
          lines = open('.github/workflows/build.yml').read().split('\n')
          bad = []
          for i, ln in enumerate(lines):
              s = ln.strip()
              if not s.startswith('#'):
                  continue
              j = i - 1
              while j >= 0 and lines[j].strip() == '':
                  j -= 1
              if j < 0:
                  continue
              prev = lines[j].rstrip()
              m = re.search(r'(\\+)$', prev)
              if m and len(m.group(1)) % 2 == 1:
                  bad.append((i + 1, s[:80]))
          if bad:
              print('FATAL: comment line(s) inside shell \\-continuation:')
              for ln_no, txt in bad:
                  print(f'  build.yml line {ln_no}: {txt}')
              print('Move the comment above or below the continued command;')
              print('never between its backslash continuations.')
              sys.exit(1)
          print('workflow continuation lint: OK')
          PYEOF

      - name: Show host capacity
        run: |
          df -h /
          free -h

      # The GNOME + ONLYOFFICE + education software image is large; reclaim
      # the big preinstalled toolchains that this build never uses
      # (~30-40 GB on a GitHub-hosted ubuntu-24.04 runner) to avoid
      # running out of space at mkinitramfs time.
      - name: Free runner disk space
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Install live-build host tooling
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # Avoid the intermittently stalled Azure Ubuntu mirror on hosted
          # runners; replace all runner sources with a minimal public archive
          # configuration for deterministic setup.
          sudo rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          cat <<'EOF' | sudo tee /etc/apt/sources.list
          deb http://archive.ubuntu.com/ubuntu noble main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu noble-security main restricted universe multiverse
          EOF
          # GitHub-hosted runners occasionally stall on a transient mirror
          # connection; fail fast and retry instead of consuming the whole job.
          sudo timeout 12m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update
          sudo timeout 12m apt-get install -y --no-install-recommends \
            live-build debootstrap debian-archive-keyring squashfs-tools xorriso grub-pc-bin \
            grub-efi-amd64-bin isolinux syslinux syslinux-common syslinux-utils mtools dosfstools gpg cpio jq initramfs-tools-core socat qemu-system-x86 ovmf desktop-file-utils
          lb --version
          docker --version

      - name: Fetch pinned binary packages
        run: |
          set -euxo pipefail
          # Pinned third-party binary packages only (PeaZip). XWLightOS
          # ships no AI components and no longer builds its own desktop
          # components.
          # Note: this step runs on the host runner (not inside docker),
          # so pass the real repo path explicitly instead of relying on
          # the script's /workspace default (container-only).
          ROOT="$GITHUB_WORKSPACE" bash ./scripts/fetch-xwlightos-binary-packages.sh
          # Component lock manifest: every consumer (validation, JSON manifest,
          # live-input staging) expects this file, so generate it from the
          # packages that were actually fetched.
          ( cd artifacts/packages && for deb in *.deb; do
              printf '%s\t%s\n' "$(dpkg-deb -f "$deb" Package)" "$(dpkg-deb -f "$deb" Version)"
            done | sort > XWLIGHTOS-1.0-COMPONENTS.txt )
          python3 scripts/write-xwlightos-build-manifest.py
          test -f artifacts/packages/SHA256SUMS
          ( cd artifacts/packages && sha256sum -c SHA256SUMS )
          bash scripts/validate-xwlightos-component-packages.sh

      - name: Stage verified XWLightOS 1.0 packages and hooks
        run: |
          set -euxo pipefail
          sudo ROOT="$GITHUB_WORKSPACE" PKGS="$GITHUB_WORKSPACE/artifacts/packages" \
            bash scripts/stage-xwlightos-live-inputs.sh
          ls -lh config/includes.chroot/opt/xwlightos/packages
          find config/hooks -maxdepth 1 -name '*.chroot' -type f -printf '%f\n' | sort

      - name: Configure XWLightOS live-build image
        run: |
          set -euxo pipefail
          sudo rm -rf lb .build stage cache auto chroot binary binary.tmp *.iso build.log 2>/dev/null || true
          # The GNOME + AI runtime + ONLYOFFICE image pushes
          # binary/live/filesystem.squashfs past genisoimage's 4GiB limit;
          # live-build 3.0~a57 always uses genisoimage and offers
          # GENISOIMAGE_OPTIONS_EXTRA (written into config/common by
          # lb config) as the escape hatch for extra mkisofs flags.
          # Serial console for the QEMU smoke test: console=tty0 keeps boot
          # messages on VGA; console=ttyS0 maps /dev/console to the serial
          # port so kernel messages still land in the smoke test capture
          # over -serial file:. journald forwarding is deliberately NOT
          # enabled here: systemd.journald.forward_to_console=1 re-enables
          # boot-time console text that masks the Plymouth splash on real
          # hardware (user 2026-10-24 report: splash never shows, only
          # scrolling text), and the old "harmless on real hardware"
          # assumption does not hold on all boards. Trade-off: the smoke
          # test serial log now carries kernel messages, and the GDM
          # autologin marker in it is best-effort (the smoke script
          # already treats a missing marker as a note, not a failure).
          # NOTE: never put comment lines between the \-continuations of the
          # lb config command below; bash strips the backslash-newline before
          # parsing comments, which terminates the command early and turns the
          # next flag (e.g. --compression) into a "command not found" (exit 127).
          sudo GENISOIMAGE_OPTIONS_EXTRA="-allow-limited-size" lb config \
            --ignore-system-defaults \
            --mode debian \
            --initramfs live-boot \
            --initsystem systemd \
            --distribution bookworm \
            --architectures amd64 \
            --linux-packages linux-image \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://deb.debian.org/debian" \
            --parent-mirror-bootstrap "http://deb.debian.org/debian" \
            --mirror-chroot "http://deb.debian.org/debian" \
            --parent-mirror-chroot "http://deb.debian.org/debian" \
            --mirror-chroot-security "http://security.debian.org/debian-security" \
            --parent-mirror-chroot-security "http://security.debian.org/debian-security" \
            --mirror-binary "http://deb.debian.org/debian" \
            --parent-mirror-binary "http://deb.debian.org/debian" \
            --mirror-binary-security "http://security.debian.org/debian-security" \
            --parent-mirror-binary-security "http://security.debian.org/debian-security" \
            --security false \
            --mirror-debian-installer "http://deb.debian.org/debian" \
            --keyring-packages "debian-archive-keyring" \
            --binary-images iso-hybrid \
            --compression gzip \
            --bootappend-live "components quiet splash console=tty0 console=ttyS0,115200n8" \
            --iso-application "XWLightOS Live" \
            --iso-publisher "SYSTEM-Intel-MIC" \
            --iso-volume "XWLightOS 1.0" \
            --source false \
            --zsync false \
            --firmware-chroot false \
            --apt-recommends false \
            --debian-installer false

          sudo bash scripts/prepare-xwlightos-live-build-compression.sh

          sudo mkdir -p config/archives
          cat <<'EOF' | sudo tee config/archives/xwlightos.list.chroot
          deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware
          EOF
          cat <<'EOF' | sudo tee config/archives/xwlightos.list.binary
          deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF
          sudo chmod 755 config/hooks/*.chroot \
            config/includes.chroot/usr/local/bin/xwlightos-installer \
            config/includes.chroot/usr/local/bin/xwlightos-power-action \
            config/includes.chroot/usr/local/bin/xwlightos-logout \
            config/includes.chroot/usr/local/sbin/xwlightos-live-session-init \
            config/includes.chroot/usr/local/libexec/xwlightos-privileged-action
          # Keep isolinux.bin and every COM32 runtime module from the same
          # syslinux package. In particular, isolinux.cfg -> vesamenu.c32
          # requires ldlinux.c32, libcom32.c32 and libutil.c32 at boot time.
          sudo cp -f /usr/lib/ISOLINUX/isolinux.bin config/bootloaders/isolinux/isolinux.bin
          sudo cp -f /usr/lib/syslinux/modules/bios/*.c32 config/bootloaders/isolinux/
          test -s config/bootloaders/isolinux/isolinux.bin
          test -s config/bootloaders/isolinux/ldlinux.c32
          test -s config/bootloaders/isolinux/libcom32.c32
          test -s config/bootloaders/isolinux/libutil.c32
          test -s config/bootloaders/isolinux/vesamenu.c32
          sudo find config -maxdepth 4 -type f -printf '%p\n' | sort | head -200

      - name: Build XWLightOS ISO
        run: |
          set -euxo pipefail
          echo "XWLightOS build started: $(date --iso-8601=seconds)" | tee build.log
          sudo lb build 2>&1 | tee -a build.log

          # The GNOME-based image is larger (~3.6GB); drop the multi-GB chroot
          # before the repack step, which needs room for a second full ISO copy.
          # Only binary/ (the ISO tree) is needed from here on.
          sudo rm -rf chroot chroot.tmp 2>/dev/null || true
          df -h /
          # Use the same repack implementation locally and in CI. It retains the
          # matching ISOLINUX tree and injects an x86_64 EFI System Partition.
          ISO_SOURCE="$(find . -maxdepth 2 -type f \( -name '*XWLightOS*.iso' -o -name '*.hybrid.iso' \) | head -n1)"
          test -n "$ISO_SOURCE"
          chmod 755 scripts/repack-xwlightos-dualboot-iso.sh
          XWLIGHTOS_BINARY_TREE="$GITHUB_WORKSPACE/binary" \
            bash scripts/repack-xwlightos-dualboot-iso.sh "$ISO_SOURCE" 2>&1 | tee -a build.log
          echo "XWLightOS dual BIOS/UEFI ISO finished: $(date --iso-8601=seconds)" | tee -a build.log

      - name: Reclaim disk before verification
        run: |
          set -euxo pipefail
          df -h /
          # The live-build trees and container layers are no longer needed:
          # the final ISO is standalone after the repack step above.
          sudo rm -rf lb .build stage cache chroot binary binary.tmp artifacts/work 2>/dev/null || true
          sudo docker system prune -af --volumes 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h /

      - name: Verify XWLightOS ISO
        id: iso
        run: |
          set -euxo pipefail
          ISO_SOURCE="$(find . -maxdepth 2 -type f \( -name '*XWLightOS*.iso' -o -name '*.hybrid.iso' \) | head -n1)"
          test -n "$ISO_SOURCE"
          test -s "$ISO_SOURCE"
          ISO="XWLightOS-1.0-amd64-livecd.iso"
          mv "$ISO_SOURCE" "$ISO"
          test -s "$ISO"
          echo "iso_path=$ISO" >> "$GITHUB_OUTPUT"
          # Inspect the final ISO rather than trusting the live-build log.
          xorriso -indev "$ISO" -report_el_torito plain 2>&1 | tee iso-boot-report.txt
          BOOT_CHECK="$(mktemp -d)"
          xorriso -osirrox on -indev "$ISO" -extract /isolinux/ldlinux.c32 "$BOOT_CHECK/ldlinux.c32" >/dev/null 2>&1
          xorriso -osirrox on -indev "$ISO" -extract /isolinux/vesamenu.c32 "$BOOT_CHECK/vesamenu.c32" >/dev/null 2>&1
          xorriso -osirrox on -indev "$ISO" -extract /efi.img "$BOOT_CHECK/efi.img" >/dev/null 2>&1
          test -s "$BOOT_CHECK/ldlinux.c32"
          test -s "$BOOT_CHECK/vesamenu.c32"
          test -s "$BOOT_CHECK/efi.img"
          # Inspect the compressed target filesystem for installer-critical files.
          ROOT_CHECK="$(mktemp -d)"
          xorriso -osirrox on -indev "$ISO" -extract /live/filesystem.squashfs "$ROOT_CHECK/filesystem.squashfs" >/dev/null 2>&1
          unsquashfs -l "$ROOT_CHECK/filesystem.squashfs" > "$ROOT_CHECK/squashfs.list"
          grep -q '/usr/bin/unsquashfs$' "$ROOT_CHECK/squashfs.list"
          grep -q '/usr/bin/rsync$' "$ROOT_CHECK/squashfs.list"
          grep -q '/usr/lib/.*/calamares/modules/partition/libcalamares_viewmodule_partition.so$' "$ROOT_CHECK/squashfs.list"
          grep -q '/usr/lib/.*/calamares/modules/mount/module.desc$' "$ROOT_CHECK/squashfs.list"
          grep -q '/etc/calamares/branding/xwlightos/show.qml$' "$ROOT_CHECK/squashfs.list"
          grep -q '/etc/calamares/branding/xwlightos/stylesheet.qss$' "$ROOT_CHECK/squashfs.list"
          rm -rf "$BOOT_CHECK" "$ROOT_CHECK"
          grep -q -E 'El Torito boot img.*BIOS|El Torito boot img.*UEFI|EFI|efi.img|isolinux' iso-boot-report.txt
          chmod 755 scripts/validate-xwlightos-live-image.sh
          sudo bash scripts/validate-xwlightos-live-image.sh "$ISO"
          sha256sum "$ISO" | tee XWLightOS-1.0-amd64-livecd.iso.sha256
          cat > XWLightOS-1.0-release-notes.md <<EOF
          # XWLightOS 1.0 Preview — LiveCD with installer

          Build: ${GITHUB_RUN_NUMBER}
          Commit: ${GITHUB_SHA}

          This hybrid ISO includes the GNOME desktop with the WhiteSur macOS-like
          theme, XWLightOS boot and installer branding, Chinese Fcitx5 input
          support, Firefox ESR, VLC, Image Viewer, Text Editor, PeaZip, and
          ONLYOFFICE DesktopEditors (default for documents/spreadsheets/
          presentations/PDF, multi-window mode). PeaZip comes from the pinned
          official DEB in packages/binaries.lock.tsv.

          Education software (DingTalk, Seewo whiteboard, Seewo terminal
          manager) is installed from vendor packages staged at
          /opt/xwlightos/edu-packages during the build.

          Note: the build pipeline and QEMU BIOS/UEFI smoke checks verify that
          the image boots. Behavior on real hardware still awaits
          physical-machine verification — do not advertise this preview as
          "ready out of the box" yet.

          Verify the ISO before writing it to USB:

          \`\`\`sh
          sha256sum -c XWLightOS-1.0-amd64-livecd.iso.sha256
          \`\`\`
          EOF
          ls -lh "$ISO" XWLightOS-1.0-amd64-livecd.iso.sha256 XWLightOS-1.0-release-notes.md build.log

      - name: Smoke boot XWLightOS 1.0 ISO in QEMU BIOS and UEFI
        run: |
          set -euxo pipefail
          chmod 755 scripts/qemu-boot-smoke.sh scripts/validate-xwlightos-live-image.sh
          bash scripts/qemu-boot-smoke.sh "${{ steps.iso.outputs.iso_path }}" bios 260
          bash scripts/qemu-boot-smoke.sh "${{ steps.iso.outputs.iso_path }}" uefi 260

      # NOTE: release publishing goes straight to GitHub Releases; the old
      # actions/upload-artifact steps were removed (2026-10-12) after the
      # Actions artifact storage quota was hit. QEMU screenshots, logs and
      # package manifests now ride along with the release below.

      - name: Split ISO for GitHub release upload
        # GitHub release assets must each be under 2GiB (hard limit, hit on
        # 2026-10-09: "size must be less than 2147483648"). The GNOME-based
        # AI-runtime ISO is ~3.6GiB, so split it into 1900M parts and upload
        # the parts plus per-part checksums; the whole-ISO sha256 still
        # verifies the merge.
        id: splitpkg
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/xwlightos-1.0-integration') && success()
        run: |
          set -euxo pipefail
          ISO="${{ steps.iso.outputs.iso_path }}"
          LIMIT=2000000000
          SIZE=$(stat -c%s "$ISO")
          echo "ISO size: $SIZE bytes (release-asset limit: $LIMIT)"
          FILES=()
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "ISO exceeds the 2GiB release-asset limit; splitting into 1900M parts"
            split -b 1900M -d --suffix-length=3 --numeric-suffixes=1 "$ISO" "${ISO}."
            ls -lh "${ISO}".[0-9]*
            sha256sum "${ISO}".[0-9]* > "${ISO}.parts.sha256"
            cat "${ISO}".parts.sha256
            FILES=("${ISO}".[0-9]* "${ISO}.parts.sha256")
            ISO_GB="$(awk "BEGIN {printf \"%.1f\", $SIZE/1073741824}")"
            cat >> XWLightOS-1.0-release-notes.md <<'EOF'

          ## 下载说明（ISO 超过 2GiB，已分卷）

          GitHub Release 单个附件上限 2GiB，本版 ISO 约 __ISO_GB__GiB，已按 1900M 分卷上传（.001/.002/.003……）。
          下载全部 XWLightOS-1.0-amd64-livecd.iso.0* 文件后合并：

          ```sh
          cat XWLightOS-1.0-amd64-livecd.iso.0* > XWLightOS-1.0-amd64-livecd.iso
          sha256sum -c XWLightOS-1.0-amd64-livecd.iso.sha256
          ```
          EOF
            sed -i "s/__ISO_GB__/$ISO_GB/" XWLightOS-1.0-release-notes.md
          else
            echo "ISO fits the 2GiB release-asset limit; uploading whole"
            FILES=("$ISO")
          fi
          {
            echo "files<<SPLITPKG_EOF"
            printf '%s\n' "${FILES[@]}"
            echo "SPLITPKG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish XWLightOS 1.0 Preview Release
        # Preview releases are published automatically after the ISO verifier
        # and both BIOS/UEFI QEMU smoke checks succeed on main or the
        # integration branch.
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/xwlightos-1.0-integration') && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xwlightos-1.0-preview-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: XWLightOS 1.0 Preview Build ${{ github.run_number }}
          body_path: XWLightOS-1.0-release-notes.md
          prerelease: true
          files: |
            ${{ steps.splitpkg.outputs.files }}
            XWLightOS-1.0-amd64-livecd.iso.sha256
            XWLightOS-1.0-release-notes.md
            XWLightOS-1.0-amd64-livecd.iso.bios.ppm
            XWLightOS-1.0-amd64-livecd.iso.uefi.ppm
            build.log
            iso-boot-report.txt
            artifacts/packages/SHA256SUMS
            artifacts/packages/XWLIGHTOS-1.0-BUILD-MANIFEST.json
            artifacts/packages/XWLIGHTOS-1.0-COMPONENTS.txt

      - name: Cleanup runner disk
        if: always()
        run: |
          sudo rm -rf lb .build stage cache chroot binary binary.tmp artifacts/work 2>/dev/null || true
          df -h /
